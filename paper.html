<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice</title>
<link rel="stylesheet" href="style.css">
<script src="users.js"></script>
<script src="auth.js"></script>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d4ed8"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})</script>
</head>
<body>
<header class="top">
  <div class="inner">
    <a class="back" href="index.html">&larr; All papers</a>
    <h1 id="ptitle">Loading…</h1>
    <button id="palbtn" class="ghost" type="button">Questions</button>
  </div>
</header>
<div class="layout">
  <aside id="pal" class="pal">
    <div class="pal-head"><b>Questions</b><span id="score"></span></div>
    <div id="palgrid" class="palgrid"></div>
    <div class="legend"><i class="ok"></i>Correct <i class="bad"></i>Wrong <i class="cur"></i>Current</div>
    <button id="reset" class="ghost small" type="button">Reset this paper</button>
  </aside>
  <main id="main" class="wrap q"></main>
</div>
<script src="diagrams.js"></script>
<script src="quiz.js"></script>
</body>
</html>
